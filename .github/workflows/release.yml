name: Build

# Jeder Push auf master und jeder Pull Request lässt die Tests laufen, ihr Ergebnis zeigt das
# Badge im README. Ein Tag wie v1.0.0 baut zusätzlich grimmory-ui.koplugin-v1.0.0.zip und legt damit
# ein GitHub-Release an. Das Zip enthält den Ordner grimmory-ui.koplugin/, so wie ihn der AppStore
# und das Selbst-Update in koreader/plugins/ auspacken.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# Nur lesen, Schreibrecht bekommt allein der Release-Job. Pull Requests laufen so ohne Schreibrecht.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y luajit
      - run: luajit tests/test_logic.lua
      - run: luajit tests/check_l10n.lua

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version in _meta.lua prüfen
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "version = \"$version\"" grimmory-ui.koplugin/_meta.lua \
            || { echo "_meta.lua nennt nicht Version $version"; exit 1; }
      # Die Lizenz kommt mit in den Plugin-Ordner, so liegt sie auch auf jedem Gerät.
      - name: Zip bauen
        run: |
          cp LICENSE grimmory-ui.koplugin/
          zip -r "grimmory-ui.koplugin-${GITHUB_REF_NAME}.zip" grimmory-ui.koplugin
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "grimmory-ui.koplugin-${GITHUB_REF_NAME}.zip" --generate-notes
